<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#7C4DFF">
<title>Reset password — FlutterDataPlug</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand"><img src="/logo-icon.png" alt="" class="brand-icon"><span class="brand-flutter">flutter</span><span class="brand-name">DataPlug</span></div>
    <p class="auth-sub">Choose a new password</p>

    <div class="error-banner" id="error-banner"></div>

    <form id="reset-form">
      <div class="field">
        <label for="new-password">New password</label>
        <input id="new-password" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="field">
        <label for="confirm-password">Confirm new password</label>
        <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <button class="btn-primary" type="submit" id="submit-btn">Reset password</button>
    </form>

    <div id="success-state" style="display:none;text-align:center;">
      <p style="color:var(--signal);font-weight:600;">Password updated.</p>
      <a href="/login.html" class="btn-primary" style="display:block;text-decoration:none;">Go to login</a>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');
const errorBanner = document.getElementById('error-banner');

if (!token) {
  errorBanner.textContent = 'This reset link is missing a token. Request a new one.';
  errorBanner.classList.add('show');
  document.getElementById('reset-form').style.display = 'none';
}

document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBanner.classList.remove('show');

  const newPassword = document.getElementById('new-password').value;
  const confirmPassword = document.getElementById('confirm-password').value;
  if (newPassword !== confirmPassword) {
    errorBanner.textContent = 'Passwords do not match.';
    errorBanner.classList.add('show');
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Resetting...';

  try {
    await API.post('/auth/reset-password', { token, newPassword });
    document.getElementById('reset-form').style.display = 'none';
    document.getElementById('success-state').style.display = 'block';
  } catch (err) {
    errorBanner.textContent = err.message;
    errorBanner.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Reset password';
  }
});
</script>
<script src="/js/track.js"></script>
</body>
</html>
