<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#7C4DFF">
<title>Forgot password — FlutterDataPlug</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand"><img src="/logo-icon.png" alt="" class="brand-icon"><span class="brand-flutter">flutter</span><span class="brand-name">DataPlug</span></div>
    <p class="auth-sub">Reset your password</p>

    <div class="error-banner" id="error-banner"></div>
    <div class="error-banner" id="success-banner" style="background:var(--signal-dim);color:var(--signal);"></div>

    <form id="forgot-form">
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>
      <button class="btn-primary" type="submit" id="submit-btn">Send reset link</button>
    </form>

    <div class="auth-switch">
      <a href="/login.html" style="color:var(--signal);font-weight:600;">← Back to login</a>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
document.getElementById('forgot-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBanner = document.getElementById('error-banner');
  const successBanner = document.getElementById('success-banner');
  errorBanner.classList.remove('show');
  successBanner.classList.remove('show');

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Sending...';

  try {
    const data = await API.post('/auth/forgot-password', {
      email: document.getElementById('email').value.trim(),
    });
    successBanner.textContent = data.message;
    successBanner.classList.add('show');
    document.getElementById('forgot-form').reset();
  } catch (err) {
    errorBanner.textContent = err.message;
    errorBanner.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Send reset link';
  }
});
</script>
<script src="/js/track.js"></script>
</body>
</html>
